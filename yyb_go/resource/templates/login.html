<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - YYB Go 控制台</title>
  <style>
    :root { color-scheme: light; }
    * { margin:0; padding:0; box-sizing:border-box; font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif; }
    body { min-height:100vh; display:grid; place-items:center; background:oklch(0.974 0.004 250); color:oklch(0.19 0.025 252); }
    .card { background:oklch(1 0 0); border:1px solid oklch(0.885 0.012 250); border-radius:12px; box-shadow:0 10px 40px oklch(0.19 0.025 252 / 0.08); padding:32px; width:min(380px, calc(100vw - 32px)); }
    .mark { width:44px; height:44px; border-radius:10px; background:oklch(0.54 0.205 3); color:#fff; display:grid; place-items:center; font-size:22px; font-weight:700; margin:0 auto 14px; }
    h1 { font-size:18px; text-align:center; margin-bottom:4px; }
    .sub { font-size:13px; color:oklch(0.43 0.025 252); text-align:center; margin-bottom:22px; }
    label { display:block; font-size:13px; margin:0 0 6px; color:oklch(0.43 0.025 252); }
    input { width:100%; height:40px; border:1px solid oklch(0.885 0.012 250); border-radius:8px; padding:0 12px; font-size:14px; margin-bottom:14px; background:oklch(0.986 0.004 250); }
    input:focus { outline:2px solid oklch(0.82 0.08 190); border-color:transparent; }
    button { width:100%; height:42px; border:0; border-radius:8px; background:oklch(0.54 0.205 3); color:#fff; font-size:14px; font-weight:700; cursor:pointer; }
    button:hover { background:oklch(0.48 0.195 3); }
    .error { display:none; background:oklch(0.955 0.032 25); color:oklch(0.55 0.18 25); border:1px solid oklch(0.9 0.05 25); border-radius:8px; padding:9px 12px; font-size:13px; margin-bottom:14px; }
    .error.show { display:block; }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">Y</div>
    <h1>YYB Go 控制台</h1>
    <p class="sub">请登录后继续</p>
    <div class="error" id="err">用户名或密码不正确</div>
    <form method="post" action="/login">
      <input type="hidden" name="next" id="next" value="/">
      <label for="username">用户名</label>
      <input id="username" name="username" autocomplete="username" autofocus required>
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">登 录</button>
    </form>
  </main>
  <script>
    const p = new URLSearchParams(location.search);
    if (p.get("error")) document.getElementById("err").classList.add("show");
    const next = p.get("next");
    if (next && next.startsWith("/") && !next.startsWith("//")) document.getElementById("next").value = next;
    document.querySelector("form").addEventListener("submit", () => {
      const b = document.querySelector("button");
      b.disabled = true; b.textContent = "登录中…";
    });
  </script>
</body>
</html>
